# Release configuration for qualflare-go.
#
# Cloned from qualflare-cli's, minus the channels that do not fit this audience:
# no npm (Go developers have a toolchain) and no container image (CI Go images
# can `go install`). What is kept is the supply-chain posture -- checksums, a
# CycloneDX SBOM per archive, and a keyless cosign signature over the checksums
# file -- because that should not vary between the two binaries we ship.
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: qualflare-go
    main: ./cmd/qualflare-go
    binary: qualflare-go
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/Qualflare/qualflare-go/internal/version.Version={{.Version}}
      - -X github.com/Qualflare/qualflare-go/internal/version.Commit={{.Commit}}
      - -X github.com/Qualflare/qualflare-go/internal/version.Date={{.Date}}

archives:
  - id: default
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE*
      - README*

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

sboms:
  - artifacts: archive

signs:
  - cmd: cosign
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--output-signature=${signature}"
      - "--output-certificate=${certificate}"
      - "--yes"
      - "${artifact}"
    artifacts: checksum
    output: true

# Casks, not formulas: `brews` is deprecated since goreleaser v2.16, and casks
# now work under Homebrew on Linux too -- the reason the old formula existed.
# No `directory:` (casks must live in Casks/), no `license:` (casks ignore it),
# and no `test:` -- casks have no `brew test` equivalent, so the smoke test that
# ran `qualflare-go -version` on install is gone. The release workflow still
# runs it against the built binary before publishing.
homebrew_casks:
  - name: qualflare-go
    repository:
      owner: qualflare
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://qualflare.com/go-test-reporting/
    description: Native go test reporter for Qualflare
    # Skipped without a token, and never for a prerelease -- an rc tag must not
    # overwrite the cask `brew install` resolves.
    skip_upload: "{{ if and .Env.HOMEBREW_TAP_TOKEN (not .Prerelease) }}false{{ else }}true{{ end }}"
    # The binaries carry a cosign signature, which is not Apple notarization.
    # A cask downloads the archive itself, so macOS quarantines it and reports
    # "damaged and cannot be opened" -- the old formula never hit this. Guarded
    # on OS.mac? because this same cask installs on Linux.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/qualflare-go"]
          end

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - '^chore:'
      - Merge pull request
      - Merge branch
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))?\!?:.+$'
      order: 0
    - title: Bug Fixes
      regexp: '^.*?fix(\(.+\))?\!?:.+$'
      order: 1
    - title: Other
      order: 99

release:
  github:
    owner: Qualflare
    name: qualflare-go
  prerelease: auto
  draft: false
  name_template: "{{.ProjectName}} v{{.Version}}"
  footer: |
    ## Installation

    ### go install
    ```bash
    go install github.com/Qualflare/qualflare-go/cmd/qualflare-go@{{ .Tag }}
    ```

    ### Homebrew (macOS/Linux)
    ```bash
    brew install qualflare/tap/qualflare-go
    ```

    ### Binaries
    Download an archive below. `checksums.txt` is signed with cosign; verify with:
    ```bash
    cosign verify-blob --signature checksums.txt.sig --certificate checksums.txt.pem checksums.txt
    ```

    ### The metadata library
    ```bash
    go get github.com/Qualflare/qualflare-go@{{ .Tag }}
    ```

snapshot:
  version_template: "{{ incpatch .Version }}-next"
